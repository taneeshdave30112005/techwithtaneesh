<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Contact - TechWithTaneesh</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div class="brand">
      <div class="logo">T</div>
      <div>
        <h1>Contact</h1>
        <div class="tagline">Say hi or send a collaboration request</div>
      </div>
    </div>
  </header>

  <nav class="nav">
    <a href="index.html">Home</a>
    <a href="articles.html">Articles</a>
    <a href="reviews.html">Reviews</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
  </nav>

  <main class="container" style="grid-template-columns:1fr;">
    <section class="main">
      <div class="card">
        <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
          <input name="name" placeholder="Your name" required>
          <input name="_replyto" type="email" placeholder="Your email" required>
          <textarea name="message" rows="6" placeholder="Your message" required></textarea>
          <button type="submit">Send message</button>
        </form>
        <p style="color:var(--muted); margin-top:10px">Tip: replace <code>YOUR_FORM_ID</code> with your Formspree form ID to receive messages via email.</p>
      </div>
    </section>
  </main>

  <footer class="footer">© 2025 TechWithTaneesh</footer>
</body>
</html>
